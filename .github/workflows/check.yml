name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Look for verified merge
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      verified: ${{ steps.merge.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reuse checks only for an identical merged tree
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verified_merge.py

  plan:
    name: Plan checks
    needs: reuse
    if: >-
      always() && !cancelled() &&
      (needs.reuse.result == 'skipped' ||
       (needs.reuse.result == 'success' && needs.reuse.outputs.verified != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Assign every check exactly once
        id: plan
        run: |
          matrix=$(nix eval --json --no-update-lock-file .#lib.ciMatrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      # Cache individual locally built store paths; dependencies already on
      # cache.nixos.org are not uploaded again. No separate cache account needed.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - name: Evaluate and build assigned checks
        shell: bash
        env:
          CHECK_INSTALLABLES: ${{ toJSON(matrix.installables) }}
        run: |
          installables=()
          while IFS= read -r installable; do
            installables+=("$installable")
          done < <(jq -er '.[]' <<< "$CHECK_INSTALLABLES")
          test "${#installables[@]}" -gt 0
          start=$SECONDS
          status=0
          nix build --no-link --print-build-logs --no-update-lock-file \
            --keep-going "${installables[@]}" || status=$?
          printf 'Evaluation and build: %s seconds; exit status: %s\n' \
            "$((SECONDS - start))" "$status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  complete:
    name: Check complete
    if: ${{ always() }}
    needs: [reuse, plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every group to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          VERIFIED_MERGE: ${{ needs.reuse.outputs.verified }}
        run: |
          if [ "$REUSE_RESULT" = success ] && [ "$VERIFIED_MERGE" = true ]; then
            echo 'Reused successful PR checks for the identical merged tree; no rebuild was run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$PLAN_RESULT" = success
          test "$CHECK_RESULT" = success
