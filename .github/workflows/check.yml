name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Verify upstream assumptions
        run: nix eval --json --show-trace ".#lib.upstreamAssumptions.${{ matrix.system }}"
      - name: Evaluate all hosts and checks
        if: matrix.system == 'x86_64-linux'
        run: nix flake check --no-build --all-systems
      - name: Build native checks
        env:
          CHECK_SYSTEM: ${{ matrix.system }}
        run: |
          nix build --no-link --print-build-logs --impure --expr '
            let flake = builtins.getFlake (toString ./.);
            in builtins.attrValues flake.checks.${builtins.getEnv "CHECK_SYSTEM"}
          '
